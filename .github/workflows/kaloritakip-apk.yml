name: KaloriTakip APK

on:
  push:
    branches: ['**']
    paths:
      - 'kaloritakip/**'
      - '.github/workflows/kaloritakip-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Generate platform folders
        working-directory: kaloritakip
        run: |
          flutter create . --project-name kaloritakip --platforms android --org com.kaloritakip
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: kaloritakip
        run: flutter pub get

      - name: Run tests
        working-directory: kaloritakip
        run: flutter test

      - name: Build APK
        working-directory: kaloritakip
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaloritakip-apk
          path: kaloritakip/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK to release
        working-directory: kaloritakip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/KaloriTakip.apk
          gh release delete kaloritakip-latest --yes --cleanup-tag || true
          gh release create kaloritakip-latest /tmp/KaloriTakip.apk \
            --title "KaloriTakip (güncel APK)" \
            --notes "En son otomatik derleme. İndirmek için KaloriTakip.apk dosyasına tıkla." \
            --target "$GITHUB_SHA"

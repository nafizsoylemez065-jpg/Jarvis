name: KaloriTakip APK

on:
  push:
    branches: ['**']
    paths:
      - 'kaloritakip/**'
      - '.github/workflows/kaloritakip-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true

      - name: Generate platform folders
        working-directory: kaloritakip
        run: |
          flutter create . --project-name kaloritakip --platforms android --org com.kaloritakip
          rm -f test/widget_test.dart

      - name: Install dependencies
        working-directory: kaloritakip
        run: flutter pub get

      - name: Run tests
        working-directory: kaloritakip
        run: flutter test

      - name: Build release APK
        working-directory: kaloritakip
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaloritakip-apk
          path: kaloritakip/build/app/outputs/flutter-apk/app-release.apk
